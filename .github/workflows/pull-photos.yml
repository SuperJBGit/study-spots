# Once a day, import photos you've approved in the Study Spots sheet (scripts/pull-photos.mjs),
# check them with the tests, commit, and redeploy the site. Run it by hand from the Actions tab any time.
name: Import approved photos

on:
  schedule:
    - cron: "17 10 * * *" # 6:17am Toronto (10:17 UTC in summer time)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/pull-photos.mjs
      - run: npm test
        env:
          TZ: America/Toronto
      - name: Commit and redeploy if anything was imported
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Nothing new."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/photos.json photos/
          git commit -m "Import approved photos"
          git push
          # Pushes made with the workflow token don't trigger a Pages build on their own, so ask for one.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; the next push will deploy it."
